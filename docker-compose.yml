services:
  bot:
    build: .
    image: soundcloud-player-bot:latest
    container_name: soundcloud-player-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOWNLOAD_DIR: /data/downloads
      # SQLite must live on a named volume or it is lost on every container recreate.
      DB_PATH: /data/db/scbot.db
      TZ: Europe/Moscow
    volumes:
      - downloads:/data/downloads
      - scbot_db:/data/db
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostbyname('api.telegram.org')"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Отдельный образ/процесс от корневого Dockerfile — один CMD не может запустить и бота, и webapp.
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    image: soundcloud-player-webapp:latest
    container_name: soundcloud-player-webapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/db/scbot.db
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    volumes:
      - scbot_db:/data/db

volumes:
  downloads:
  scbot_db:
